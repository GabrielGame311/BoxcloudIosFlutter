name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: dashboard_app

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
        working-directory: dashboard_app

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/zip -qry Runner-unsigned.ipa Payload
        working-directory: dashboard_app

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-app-unsigned-ipa
          path: dashboard_app/build/ios/ipa/Runner-unsigned.ipa
          if-no-files-found: error
          retention-days: 14